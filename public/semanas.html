<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Semanas | Sistema Heurístico Evolutivo</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
<link rel="icon" href="data:,">
   
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="index.html">

                <i class="bi bi-graph-up-arrow"></i>

                Sistema Heurístico

            </a>

        </div>

    </nav>

    <!-- CONTENIDO -->

    <main class="container py-5">

        <div class="row">

            <div class="col-lg-12">

                <h2 class="section-title">

                    Nueva Semana

                </h2>

            </div>

        </div>

        <!-- FORMULARIO -->

        <div class="card shadow">

            <div class="card-body">

                <div class="row">

                    <!-- Semana -->

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Semana

                        </label>

                        <input

                            id="txtSemana"

                            class="form-control"

                            type="number"

                            min="1">

                    </div>

                    <!-- Fecha -->

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Fecha

                        </label>

                        <input

                            id="txtFecha"

                            class="form-control"

                            type="date">

                    </div>

                </div>

                <!-- NUMEROS -->

                <div class="row mt-3">

                    <h5>

                        Números sorteados

                    </h5>

                </div>

                <div class="row g-2">

                    <div class="col"><input id="n1" class="form-control numero" type="number" min="0" max="99"></div>
                    <div class="col"><input id="n2" class="form-control numero" type="number" min="0" max="99"></div>
                    <div class="col"><input id="n3" class="form-control numero" type="number" min="0" max="99"></div>
                    <div class="col"><input id="n4" class="form-control numero" type="number" min="0" max="99"></div>
                    <div class="col"><input id="n5" class="form-control numero" type="number" min="0" max="99"></div>

                </div>

                <div class="row g-2 mt-2">

                    <div class="col"><input id="n6" class="form-control numero" type="number" min="0" max="99"></div>
                    <div class="col"><input id="n7" class="form-control numero" type="number" min="0" max="99"></div>
                    <div class="col"><input id="n8" class="form-control numero" type="number" min="0" max="99"></div>
                    <div class="col"><input id="n9" class="form-control numero" type="number" min="0" max="99"></div>
                    <div class="col"><input id="n10" class="form-control numero" type="number" min="0" max="99"></div>

                </div>

                <!-- BOTONES -->

                <div class="mt-4 d-flex gap-2">

                    <button

                        id="btnGuardar"

                        class="btn btn-success">

                        <i class="bi bi-floppy"></i>

                        Guardar

                    </button>

                    <button

                        id="btnLimpiar"

                        class="btn btn-secondary">

                        <i class="bi bi-eraser"></i>

                        Limpiar

                    </button>

                </div>

            </div>

        </div>

        <!-- HISTORIAL -->

        <div class="card mt-5 shadow">

            <div class="card-body">

                <h3>

                    Historial

                </h3>

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead>

                            <tr>

                                <th>Semana</th>

                                <th>Fecha</th>

                                <th>Números</th>

                                <th>Acciones</th>

                            </tr>

                        </thead>

                        <tbody id="tablaSemanas">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica -->

    <script type="module"
        src="js/semanas.js"></script>

</body>

</html>
